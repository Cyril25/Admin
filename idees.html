<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://www.gstatic.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://accounts.google.com; frame-src 'self' https://ofildudoubs-hub.firebaseapp.com https://apis.google.com https://accounts.google.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Carnet d'idées et de projets — hub O'Fil du Doubs.">
    <title>Idées / Projets — Hub O'Fil du Doubs</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div id="app-content" class="page" style="display:none">

        <div class="page-header">
            <h1><i class="fa-solid fa-lightbulb"></i> Idées / Projets</h1>
            <button type="button" class="btn-add" onclick="ouvrirModale(null)">
                <i class="fa-solid fa-plus"></i> Nouvelle idée
            </button>
        </div>

        <div class="toolbar">
            <div class="search">
                <i class="fa-solid fa-magnifying-glass search__icon"></i>
                <input type="text" id="search-input" class="search__input"
                       placeholder="Rechercher (titre, détail, projet…)" oninput="renderIdees()">
                <button type="button" class="search__clear" id="search-clear" onclick="clearSearch()" style="display:none">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <div id="etat-filter" class="filter-row"></div>
        <div id="projet-filter" class="filter-row"></div>
        <div id="result-count" class="result-count"></div>

        <div id="idees-list" class="idees-list"></div>

        <div class="empty-state" id="empty-state" style="display:none">
            <i class="fa-solid fa-lightbulb"></i>
            <p>Aucune idée dans ce filtre</p>
        </div>

    </div>

    <!-- Modale ajout / édition -->
    <div id="modal-overlay" class="modal-overlay" style="display:none">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h2 class="modal-title" id="modal-title">Nouvelle idée</h2>
            <div class="modal-form">
                <div class="field field--full">
                    <label for="f-titre">Titre *</label>
                    <input type="text" id="f-titre" maxlength="140" placeholder="En une phrase : quoi ?">
                </div>
                <div class="field">
                    <label for="f-projet">Projet</label>
                    <input type="text" id="f-projet" list="projet-list" placeholder="Ex : O'Fil du Doubs" autocomplete="off">
                    <datalist id="projet-list">
                        <option value="O'Fil du Doubs"></option>
                        <option value="Le Fuverat"></option>
                        <option value="Billets Touristiques"></option>
                        <option value="Collections"></option>
                        <option value="Hub admin"></option>
                        <option value="Le Phare"></option>
                        <option value="stock-watch"></option>
                        <option value="LocalFoodTruck"></option>
                        <option value="Annonces eBay"></option>
                        <option value="Transverse"></option>
                        <option value="Nouveau projet"></option>
                    </datalist>
                </div>
                <div class="field">
                    <label for="f-etat">État</label>
                    <select id="f-etat"></select>
                </div>
                <div class="field">
                    <label for="f-importance">Importance</label>
                    <select id="f-importance">
                        <option value="haute">Haute</option>
                        <option value="normale" selected>Normale</option>
                        <option value="basse">Basse</option>
                    </select>
                </div>
                <div class="field">
                    <label for="f-complexite">Complexité</label>
                    <select id="f-complexite">
                        <option value="">À estimer</option>
                        <option value="S">S — petit</option>
                        <option value="M">M — moyen</option>
                        <option value="L">L — gros</option>
                    </select>
                </div>
                <div class="field field--full">
                    <label for="f-detail">Détail</label>
                    <textarea id="f-detail" rows="5" placeholder="Le pourquoi, les questions ouvertes, les pistes…"></textarea>
                </div>
                <p class="modal-meta" id="f-meta" style="display:none"></p>
            </div>
            <div class="modal-actions">
                <button type="button" id="btn-delete" class="modal-btn modal-btn-danger" style="display:none" onclick="ouvrirModaleSuppression()">Supprimer</button>
                <button type="button" class="modal-btn" onclick="fermerModale()">Annuler</button>
                <button type="button" class="modal-btn modal-btn-primary" onclick="sauverIdee()">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modale de confirmation de suppression -->
    <div id="delete-overlay" class="modal-overlay" style="display:none">
        <div class="modal" role="alertdialog" aria-modal="true" style="max-width:460px">
            <h2 class="modal-title">Supprimer cette idée ?</h2>
            <p class="modal-desc">
                Suppression définitive. Pour la garder sans la traiter, passez-la plutôt en « Abandonnée ».
            </p>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="fermerModaleSuppression()">Annuler</button>
                <button type="button" class="modal-btn modal-btn-danger" style="margin-right:0" onclick="confirmerSuppression()">Confirmer</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" integrity="sha384-v3Z/Xdw1sCeo6M/geW7sn1Lt9obIm7MhAk8laVV+rvYFmzuWDELOiygx7dVte2dX" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" integrity="sha384-p62xBRve8PdqGDGASZtZMuHgPsyPcT5VsFwgmz2p4zaFdEtt5ZzNqxK+CLzQS7xP" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" integrity="sha384-3LctmFHtNDZwkVOSZ0fvJZJD9XR5Og5ol/MVEfNt36gUUnSYBRJN0iFjIMbFecOg" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="idees.js"></script>
</body>
</html>
