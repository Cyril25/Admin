# ============================================================
# wrangler.toml — Le notifieur Telegram du projet « taches »
# ============================================================
# Deploiement :  cd notifieur && npx wrangler deploy
# Voir README.md de ce dossier pour la mise en place complete.
#
# ⚠ AUCUN SECRET DANS CE FICHIER. Il est versionne dans un depot
# PUBLIC. Les secrets se posent avec « wrangler secret put », qui les
# range chez Cloudflare et jamais dans git.
# ============================================================

name = "ofildudoubs-notifieur"
main = "worker.js"
compatibility_date = "2026-08-19"

# Toutes les 5 minutes. Le rappel de creneau part 15 minutes avant
# l'heure : trois occasions de tomber dans la fenetre, donc un tick
# manque ne fait pas manquer le rappel.
#
# Cout : 288 reveils par jour, sur 100 000 requetes offertes. Descendre
# a la minute ne gagnerait rien et userait la marge pour rien.
[triggers]
crons = ["*/5 * * * *"]

# Les journaux des invocations passees, consultables dans le dashboard.
#
# Sans eux, le doublon du 3 septembre 2026 s'est diagnostique en lisant
# les valeurs du KV a la main : il a fallu deviner quelle cle regarder.
# Une ligne de journal donnait la reponse — le 504 de Telegram — en dix
# secondes. C'est compris dans le forfait, et ca ne se voit que le jour
# ou l'on en a besoin, c'est-a-dire trop tard si ce n'est pas deja pose.
[observability]
enabled = true

# La memoire des envois : sans elle, le rappel de 9 h 00 repartirait a
# 8 h 45, 8 h 50 et 8 h 55. Creer le namespace une fois avec
#   npx wrangler kv namespace create ENVOIS
# puis recopier l'identifiant rendu ci-dessous.
[[kv_namespaces]]
binding = "ENVOIS"
id = "34945db6daea49a79edd4a04e0efa7a3"

# ⚠ LIAISON DE SERVICE VERS LE WORKER DU GITE.
#
# Les deux Workers vivent sur le meme sous-domaine
# `cyril-samson41.workers.dev`. Un Worker qui appelle un voisin par son
# URL PUBLIQUE ne sort pas sur Internet : il reste dans le reseau
# interne de Cloudflare, ou ce nom ne se resout pas — et recoit un 404.
#
# C'est ce qui a fait echouer TOUTES les notifications du gite pendant
# huit jours, du 24 aout au 1er septembre 2026, sans qu'aucune ne parte.
# Le `fetch()` direct marchait parfaitement depuis un poste, ce qui rend
# la panne invisible a tout test local.
#
# La liaison ci-dessous est la voie prevue par Cloudflare : l'appel
# devient un RPC interne, sans DNS ni reseau.
[[services]]
binding = "GITE"
service = "menage-state"

# Valeur publique : c'est deja celle de config.js, qui part dans le
# navigateur. Elle est ici pour que le Worker n'ait pas a la deviner.
[vars]
FIREBASE_PROJECT_ID = "ofildudoubs-hub"
